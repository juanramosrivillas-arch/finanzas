:root{
  /* noche mediterr\xE1nea */
  --fondo:#151915; --sup:#1D221C; --sup2:#242A23; --linea:#2E352C;
  --txt:#EDEAE0; --txt2:#97A091; --txt3:#6B7567;
  --cyan:#8ABE97; --verde:#8ABE97; --coral:#E08A63; --magenta:#C4818C; --ambar:#D8B15E;
  --g1:#1F2A20; --g2:#151915;
  --tinte1:rgba(237,234,224,.035); --tinte2:rgba(237,234,224,.05);
  --tinte3:rgba(237,234,224,.08); --tinte4:rgba(237,234,224,.16);
  --hueco:rgba(0,0,0,.22); --velo-bg:rgba(10,13,10,.6);
  --pill-bg:rgba(29,34,28,.88); --hoja-bg:#1B201A; --input-bg:#12160F; --sobre:#141812;
  --sombra:0 1px 2px rgba(0,0,0,.30);
  --fuente: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI Variable", system-ui, -apple-system, sans-serif;
}
.app.claro{
  /* cal mediterr\xE1nea */
  --fondo:#F1EEE6; --sup:#FCFAF5; --sup2:#F7F4ED; --linea:#E3DED2;
  --txt:#1F241D; --txt2:#6D7266; --txt3:#9A9C8F;
  --cyan:#3F6B4F; --verde:#3F6B4F; --coral:#B4562F; --magenta:#8C4A55; --ambar:#A5802A;
  --g1:#E7E3D8; --g2:#F1EEE6;
  --tinte1:rgba(31,36,29,.028); --tinte2:rgba(31,36,29,.045);
  --tinte3:rgba(31,36,29,.07); --tinte4:rgba(31,36,29,.16);
  --hueco:rgba(31,36,29,.05); --velo-bg:rgba(31,36,29,.32);
  --pill-bg:rgba(252,250,245,.92); --hoja-bg:#FCFAF5; --input-bg:#F1EEE6; --sobre:#FCFAF5;
  --sombra:0 1px 2px rgba(31,36,29,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
.app{
  font-family:var(--fuente); color:var(--txt); min-height:100vh; position:relative;
  background:radial-gradient(140% 60% at 50% 0%, var(--g1) 0%, var(--g2) 60%);
  padding-bottom:120px; -webkit-font-smoothing:antialiased;
}
.lienzo{max-width:520px; margin:0 auto; padding:14px 16px 0}
.cargando{text-align:center; color:var(--txt2); padding:60px 0}

/* barras superiores */
.barra-sup{display:flex; align-items:center; gap:6px; padding:8px 0 16px}
.barra-sup h1{font-size:30px; font-weight:700; letter-spacing:-.02em; margin:0; flex:0 0 auto}
.mes-titulo{font-size:28px}
.barra-sup .acciones{margin-left:auto; display:flex; gap:2px}
.redondo{
  appearance:none; background:none; border:none; color:var(--txt2); cursor:pointer;
  width:38px; height:38px; display:grid; place-items:center; border-radius:50%;
}
.redondo:hover{background:var(--tinte3); color:var(--txt)}
.redondo.activo{color:var(--cyan)}
.redondo.chico{width:28px; height:28px}
.redondo:disabled{opacity:.4}
.redondo:focus-visible, .pill-btn:focus-visible, .chip:focus-visible, button:focus-visible{
  outline:2px solid var(--cyan); outline-offset:2px;
}

.seccion{font-size:19px; font-weight:700; margin:20px 0 10px}
.grupo-cab{display:flex; align-items:center; justify-content:space-between; margin:22px 2px 10px}
.grupo-cab h2{font-size:14px; font-weight:700; letter-spacing:.06em; margin:0; color:var(--txt)}
.grupo-cab b{font-size:15px; font-weight:600}

/* tarjetas */
.tarjeta{background:var(--sup); border:none; border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:var(--sombra)}
.tarjeta-lista{padding:0; overflow:hidden}
.etq{font-size:12.5px; color:var(--txt2); margin:0}
.cifra-lg{font-size:30px; font-weight:700; letter-spacing:-.02em; margin:2px 0 0}
.cifra-lg em{font-size:13px; font-weight:500; color:var(--txt2); font-style:normal}
.cifra-md{font-size:22px; font-weight:700; margin:0 0 12px; letter-spacing:-.01em}
.cifra-sm{font-size:19px; font-weight:700; margin:2px 0}
.verde{color:var(--verde)} .coral{color:var(--coral)} .cyan{color:var(--cyan)}
.aviso{font-size:12.5px; color:var(--txt2); background:var(--tinte1); border-radius:10px; padding:9px 11px; margin:12px 0 0; line-height:1.5}

/* inicio: disponible */
.tarjeta-disp{display:grid; grid-template-columns:1fr auto; gap:8px; position:relative; padding-bottom:56px}
.disp-datos .cifra-md:last-child{margin-bottom:0}
.anillo{position:relative; display:grid; place-items:center}
.anillo-txt{position:absolute; text-align:center}
.marca{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:#2A3D2E; color:var(--verde); margin-bottom:2px}
.marca-mal{background:#402921; color:var(--coral)}
.app.claro .marca{background:#D6F0E4}
.app.claro .marca-mal{background:#F6DED8}
.app.claro .tx-cab-mal{background:#F6DED8}
.app.claro .dia-viejo{background:#D9E4EB; color:var(--txt)}
.app.claro .dia-mal{color:#fff}
.app.claro .insignia-hoy{background:#F7EEDA; color:#8A6410; border-color:#E0CFA4}
.app.claro .insignia-mal{background:#F8E2DC; color:#A6402A; border-color:#E7C2B8}
.app.claro .desliz-riel{box-shadow:inset 0 0 0 1px var(--linea)}
.app.claro .desliz-pomo{background:var(--sup)}
.app.claro .pill{box-shadow:0 4px 18px rgba(18,33,43,.10)}
.app.claro .fab{background:#DCEEF8; border-color:#9FCFE8; box-shadow:0 4px 16px rgba(18,33,43,.12)}
.pastilla{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  background:var(--tinte3); color:var(--cyan); font-size:13.5px; font-weight:600;
  padding:7px 20px; border-radius:20px;
}

/* transacciones */
.grupo-tx{display:flex; flex-direction:column; gap:10px}
.tx{background:var(--sup); border-radius:16px; overflow:hidden; box-shadow:var(--sombra)}
.tx-cab{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--tinte1); padding:8px 14px; font-size:12.5px; color:var(--txt2);
}
.tx-cab-mal{background:#40292155}
.fecha-mal{color:var(--coral)} .fecha-hoy{color:var(--txt); font-weight:600}
.tx-marcas{display:flex; align-items:center; gap:8px; color:var(--txt3)}
.punto-alerta.rojo{color:var(--coral)} .punto-alerta.ambar{color:var(--ambar)}
.tx-fila{
  display:flex; align-items:center; gap:12px; padding:12px 14px; width:100%;
  background:none; border:none; color:inherit; font-family:inherit; text-align:left; cursor:pointer;
}
.tx-fila:hover{background:var(--tinte1)}
.icono-cat{display:grid; place-items:center; border-radius:12px; flex-shrink:0}
.tx-nom{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.tx-nom strong{font-size:16px; font-weight:600}
.tx-nom em{font-size:12.5px; color:var(--txt2); font-style:normal}
.tx-cifras{text-align:right; display:flex; flex-direction:column; gap:2px; flex-shrink:0}
.tx-cifras b{font-size:16px; font-weight:700}
.tx-cifras em{font-size:11.5px; color:var(--txt3); font-style:normal}

/* calendario */
.cal-cab{display:flex; justify-content:space-between; margin-bottom:12px}
.conmutador{display:flex; background:var(--tinte2); border-radius:12px; padding:3px}
.conmutador button{
  appearance:none; border:none; background:none; color:var(--txt2); font-family:inherit;
  font-size:14px; font-weight:600; padding:7px 18px; border-radius:9px; cursor:pointer;
}
.conmutador .on{background:var(--cyan); color:var(--sobre)}
.semana{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px}
.semana span{text-align:center; font-size:12px; color:var(--txt3); font-weight:600}
.rejilla{display:grid; grid-template-columns:repeat(7,1fr); gap:2px}
.celda{display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 0 8px; min-height:52px}
.celda.vacia{visibility:hidden}
.dia{
  display:grid; place-items:center; min-width:30px; height:26px; padding:0 6px;
  border-radius:8px; font-size:14.5px; font-weight:600; color:var(--txt2);
}
.dia-act{background:var(--cyan); color:var(--sobre)}
.dia-viejo{background:#1F3A4A; color:var(--txt)}
.dia-mal{background:var(--coral); color:#2A0F09}
.dia-hoy{box-shadow:0 0 0 1.6px var(--txt); border-radius:50%; min-width:26px; padding:0}
.saldo{font-size:9.5px; color:var(--txt3); font-variant-numeric:tabular-nums}

.fila-balance{display:flex; align-items:center; gap:14px; padding:14px 16px}
.fila-balance span{display:flex; flex-direction:column; gap:2px; min-width:0}
.fila-balance em{font-size:11.5px; color:var(--txt2); font-style:normal}
.fila-balance b{font-size:15px; font-weight:700}
.fila-balance .sep{width:1px; align-self:stretch; background:var(--linea)}

/* resumen del mes */
.resumen{padding:4px 0 20px}
.res-fila{display:flex; justify-content:space-between; align-items:center; padding:9px 0}
.res-fila span{display:flex; align-items:center; gap:9px; color:var(--txt2); font-size:14.5px}
.res-tit b{font-size:16px; font-weight:700}
.res-sub{padding:4px 0 4px 28px; font-size:13.5px}
.res-sub span{font-size:13.5px}
.res-sub b{font-weight:600; color:var(--txt2)}
.res-linea{height:1px; background:var(--linea); margin:10px 0}

/* an\xE1lisis */
.tarjeta-cat{padding:14px 16px; width:100%; text-align:left; font-family:inherit; color:inherit; cursor:pointer}
.tarjeta-cat:hover{border-color:var(--txt3)}
.cat-cab{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.cat-nom{flex:1; font-size:16px; font-weight:600}
.cat-cab b{font-size:16px; font-weight:700}
.riel{display:block; height:7px; background:var(--tinte3); border-radius:5px; overflow:hidden; margin:4px 0}
.relleno{display:block; height:100%; border-radius:5px}
.cat-pie{display:flex; justify-content:space-between; margin-top:8px; font-size:12.5px; color:var(--txt3)}
.cat-pie em{font-style:italic}

/* cuentas */
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips-mini{padding:10px 0 0}
.chip{
  appearance:none; font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  background:var(--tinte2); border:1px solid var(--linea); color:var(--txt2);
  padding:8px 16px; border-radius:20px; white-space:nowrap; display:inline-flex; align-items:center; gap:6px;
}
.chip-on{background:var(--cyan); color:var(--sobre); border-color:transparent}
.fecha-chip{background:none; border:none; color:inherit; font-family:inherit; font-size:13px; padding:0; width:auto}
.flujo-cab{margin-bottom:14px}
.flujo-linea{display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:14px}
.flujo-linea b{font-size:15.5px; font-weight:700}
.flujo-etq{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; letter-spacing:.06em; color:var(--txt2)}
.flujo-sub{margin-top:6px; font-size:13px; color:var(--txt2)}
.flujo-sub span{display:flex; align-items:center; gap:7px}
.flujo-sub b{font-size:13px; font-weight:600}
.pto{width:9px; height:9px; border-radius:3px; display:inline-block}
.verde-bg{background:var(--verde)} .coral-bg{background:var(--coral)}
.nav-mes-pill{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:16px; background:var(--tinte2); border-radius:22px; padding:8px}
.nav-mes-pill button{appearance:none; background:none; border:none; color:var(--txt2); cursor:pointer; display:grid; place-items:center}
.nav-mes-pill span{font-size:14px; font-weight:600}
.cuenta{display:flex; align-items:center; gap:12px; padding:13px 16px}
.con-linea{border-top:1px solid var(--linea)}
.cuenta-nom{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.cuenta-nom strong{font-size:16px; font-weight:600}
.cuenta-nom em{font-size:12px; color:var(--txt2); font-style:normal}
.saldo-edit{
  width:130px; text-align:right; background:none; border:1px solid transparent; color:var(--txt);
  font-family:inherit; font-size:16px; font-weight:700; padding:6px 8px; border-radius:9px;
}
.saldo-edit:hover{border-color:var(--linea)}
.saldo-edit:focus{outline:none; border-color:var(--cyan); background:var(--hueco)}
.agregar-punteado{
  width:100%; appearance:none; background:none; cursor:pointer; font-family:inherit;
  border:1.5px dashed var(--linea); border-radius:16px; color:var(--txt2);
  padding:16px; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px;
  margin-bottom:12px;
}
.agregar-punteado:hover{border-color:var(--cyan); color:var(--cyan)}

/* inversiones */
.tarjeta-inv{border-color:#2C4A44}
.inv-linea{display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:13.5px; color:var(--txt2)}
.inv-linea b{color:var(--txt); font-weight:600}
.inv-pie{display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid var(--linea); font-size:12px; color:var(--txt3)}
.activo-cab{
  display:flex; align-items:center; gap:12px; padding:13px 16px; width:100%;
  background:none; border:none; color:inherit; font-family:inherit; text-align:left; cursor:pointer;
}
.activo-detalle{padding:0 16px 16px}
.mini-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; padding:12px 0; border-top:1px solid var(--linea)}
.mini-grid span{display:flex; flex-direction:column; gap:3px}
.mini-grid em{font-size:11.5px; color:var(--txt2); font-style:normal}
.mini-grid b{font-size:15px; font-weight:700}
.mini-input{
  background:var(--hueco); border:1px solid var(--linea); color:var(--txt); font-family:inherit;
  font-size:15px; font-weight:700; padding:5px 8px; border-radius:9px; width:100%;
}
.fila-form{display:flex; gap:10px; flex-wrap:wrap}
.fila-form .campo{flex:1; min-width:110px}
.aportes{margin-top:14px; border-top:1px solid var(--linea); padding-top:8px}
.aporte{display:flex; justify-content:space-between; gap:10px; padding:6px 0; font-size:12.5px; color:var(--txt2)}
.aporte b{color:var(--txt); font-weight:600}

/* historial */
.buscador{
  width:100%; background:var(--sup); border:1px solid var(--linea); color:var(--txt);
  font-family:inherit; font-size:15px; padding:11px 14px; border-radius:14px; margin-bottom:12px;
}
.tarjeta-tot{display:flex; flex-direction:column; gap:8px}
.tarjeta-tot div{display:flex; justify-content:space-between; align-items:center}
.tarjeta-tot span{color:var(--txt2); font-size:14.5px}
.tarjeta-tot b{font-size:17px; font-weight:700}
.conteo{font-size:13.5px; color:var(--txt2); margin:0 0 12px 2px}

/* navegaci\xF3n inferior */
.pill{
  position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
  display:flex; gap:2px; background:var(--pill-bg); backdrop-filter:blur(14px);
  border:1px solid var(--linea); border-radius:30px; padding:6px; z-index:20;
}
.pill-btn{
  appearance:none; background:none; border:none; cursor:pointer; color:var(--txt3);
  width:46px; height:46px; display:grid; place-items:center; border-radius:16px;
}
.pill-on{background:#2FA9E026; color:var(--cyan)}
.fab{
  position:fixed; right:calc(50% - 258px); bottom:18px; width:56px; height:56px; border-radius:50%;
  background:#12313F; border:1px solid #2FA9E055; color:var(--cyan); cursor:pointer;
  display:grid; place-items:center; z-index:21; box-shadow:0 6px 20px #0008;
}
@media (max-width:560px){ .fab{right:16px} .pill{left:16px; transform:none; right:88px; justify-content:space-between} }

/* hojas */
.velo{position:fixed; inset:0; background:var(--velo-bg); z-index:40; display:flex; align-items:flex-end; justify-content:center}
.hoja{
  background:var(--hoja-bg); border:1px solid var(--linea); border-bottom:none;
  border-radius:22px 22px 0 0; width:100%; max-width:520px; max-height:88vh;
  display:flex; flex-direction:column; animation:sube .18s ease-out;
}
@keyframes sube{from{transform:translateY(18px); opacity:.6} to{transform:none; opacity:1}}
.agarre{width:44px; height:4px; background:var(--tinte4); border-radius:3px; margin:10px auto 4px}
.hoja-cab{display:flex; align-items:center; justify-content:space-between; padding:8px 18px 4px}
.hoja-cab h2{font-size:24px; font-weight:700; margin:0}
.hoja-acciones{display:flex; align-items:center; gap:4px}
.hoja-cuerpo{overflow-y:auto; padding:10px 18px 28px}
.hoja-nota{font-size:13px; color:var(--txt2); line-height:1.5; margin:0 0 14px}
.opcion{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
  background:none; border:none; border-bottom:1px solid var(--linea); color:inherit;
  font-family:inherit; padding:14px 2px;
}
.opcion:last-child{border-bottom:none}
.opcion strong{display:block; font-size:17px; font-weight:600; margin-bottom:2px}
.opcion em{display:block; font-size:13px; color:var(--txt2); font-style:normal; line-height:1.4}

/* formularios */
.campo{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.campo > span{font-size:12.5px; color:var(--txt2); font-weight:600}
input, select{
  background:var(--input-bg); border:1px solid var(--linea); color:var(--txt); font-family:inherit;
  font-size:16px; padding:12px 13px; border-radius:12px; width:100%;
}
input:focus, select:focus{outline:none; border-color:var(--cyan)}
.interruptor{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 16px; cursor:pointer}
.interruptor span{display:flex; flex-direction:column; gap:2px; font-size:15px}
.interruptor em{font-size:12px; color:var(--txt2); font-style:normal}
.interruptor input{width:46px; height:26px; flex-shrink:0; appearance:none; background:#2A3A47; border-radius:14px; position:relative; cursor:pointer; padding:0; border:none; transition:background .15s}
.interruptor input:checked{background:var(--cyan)}
.interruptor input::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .15s}
.interruptor input:checked::after{transform:translateX(20px)}
.btn-principal{
  width:100%; appearance:none; border:none; cursor:pointer; font-family:inherit;
  background:var(--cyan); color:var(--sobre); font-size:16px; font-weight:700;
  padding:14px; border-radius:14px; margin-top:6px;
}
.btn-principal:hover{filter:brightness(1.08)}
.btn-texto{appearance:none; background:none; border:none; cursor:pointer; font-family:inherit; color:var(--cyan); font-size:14px; font-weight:600; padding:10px 0}
.btn-peligro{appearance:none; border:none; cursor:pointer; font-family:inherit; background:var(--coral); color:#2A0F09; font-size:14px; font-weight:700; padding:10px 18px; border-radius:11px}
.fila-btns{display:flex; gap:10px; align-items:center; justify-content:flex-end}
.menu-tit{font-size:12px; letter-spacing:.1em; color:var(--txt3); margin:18px 2px 8px; font-weight:700}
.fila-ajuste{
  display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;
  background:none; border:none; color:inherit; font-family:inherit; text-align:left;
  padding:14px 16px; cursor:pointer; font-size:15px;
}
.fila-ajuste span{display:flex; flex-direction:column; gap:2px}
.fila-ajuste em{font-size:12px; color:var(--txt2); font-style:normal}
.fila-ajuste .mini-input{width:110px; text-align:right}
.fila-ajuste.peligro{color:var(--coral)}
.confirmar{padding:16px}
.confirmar p{font-size:13.5px; color:var(--txt2); line-height:1.5; margin:0 0 12px}

/* vac\xEDos */
.vacio{display:flex; flex-direction:column; align-items:center; gap:10px; padding:34px 20px; text-align:center}
.vacio-ico{display:grid; place-items:center; width:54px; height:54px; border-radius:50%; background:var(--tinte2); color:var(--txt3)}
.vacio p{font-size:14px; color:var(--txt2); line-height:1.55; margin:0; max-width:280px}

/* pantalla completa: editar pago */
.pantalla{
  position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
  background:radial-gradient(140% 50% at 50% 0%, var(--g1) 0%, var(--g2) 60%);
  animation:entra .16s ease-out;
}
@keyframes entra{from{opacity:.4; transform:translateY(10px)} to{opacity:1; transform:none}}
.pantalla-cuerpo{flex:1; overflow-y:auto; max-width:520px; width:100%; margin:0 auto; padding:14px 18px 30px}
.titulo-editar{font-size:22px; font-weight:700; margin:0 auto; padding-right:38px}
.monto-grande{text-align:center; padding:18px 0 26px}
.etq-centro{font-size:12px; letter-spacing:.12em; color:var(--txt2); font-weight:700; margin:0 0 6px}
.monto-txt{
  appearance:none; background:none; border:none; color:var(--txt); font-family:inherit;
  font-size:40px; font-weight:700; letter-spacing:-.02em; cursor:pointer; padding:0;
}
.monto-input{
  font-size:34px; font-weight:700; text-align:center; background:var(--hueco);
  border:1px solid var(--cyan); max-width:280px; margin:0 auto;
}
.insignia{
  display:inline-flex; align-items:center; gap:7px; margin-top:12px;
  background:var(--tinte3); color:var(--txt2); border:1px solid transparent;
  font-size:13px; font-weight:700; letter-spacing:.06em; padding:7px 16px; border-radius:20px;
}
.insignia-hoy{background:#3A2E12; color:var(--ambar); border-color:#6B5320}
.insignia-mal{background:#3E1C16; color:var(--coral); border-color:#6B2E22}
.detalle{display:flex; flex-direction:column}
.detalle-fila{padding:16px 2px; border-bottom:1px solid var(--linea)}
.detalle-etq{display:block; font-size:12px; letter-spacing:.1em; color:var(--txt2); font-weight:700; margin-bottom:10px}
.detalle-val{display:flex; align-items:center; gap:12px}
.detalle-val input, .detalle-val select{
  background:none; border:none; padding:0; font-size:17px; font-weight:500; color:var(--txt);
}
.detalle-val input:focus, .detalle-val select:focus{outline:none; color:var(--cyan)}
.valor-fijo{font-size:17px; color:var(--txt)}
.interruptor.borde-arriba{border-bottom:1px solid var(--linea); padding:16px 2px}
.interruptor.sin-padding{padding:0}
.interruptor.sin-padding span{font-size:16px; line-height:1.4}

/* deslizador de pago */
.deslizador{
  padding:12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
  background:linear-gradient(180deg, transparent, var(--g2) 40%);
  max-width:520px; width:100%; margin:0 auto;
}
.desliz-riel{position:relative; height:58px; border-radius:16px; overflow:hidden; display:grid; place-items:center}
.desliz-txt{font-size:17px; font-weight:600; color:var(--txt); pointer-events:none}
.desliz-pomo{
  position:absolute; top:5px; width:48px; height:48px; border-radius:13px;
  background:var(--g2); display:grid; place-items:center; pointer-events:none; transition:left .05s linear;
}
.desliz-riel input[type=range]{
  position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0;
  appearance:none; background:transparent; border:none; cursor:grab;
}
.desliz-riel input[type=range]::-webkit-slider-thumb{appearance:none; width:56px; height:58px; background:transparent; cursor:grab}
.desliz-riel input[type=range]::-moz-range-thumb{width:56px; height:58px; background:transparent; border:none; cursor:grab}
.desliz-riel input[type=range]:focus-visible{outline:2px solid var(--txt); outline-offset:2px}

/* tarjetas de cr\xE9dito */
.tarjeta-extra{padding:2px 16px 14px; background:var(--tinte1)}
.cuota{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--linea)}
.cuota b{font-size:14.5px; font-weight:700}
.cuota .cuenta-nom strong{font-size:14.5px}
.fila-btns-izq{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}

/* formulario a pantalla completa */
.etq-activa{color:var(--cyan)}
.monto-input-plano{
  background:none; border:none; text-align:center; color:var(--txt);
  font-family:inherit; font-size:40px; font-weight:700; letter-spacing:-.02em; padding:4px 0;
}
.monto-input-plano::placeholder{color:var(--txt3)}
.monto-input-plano:focus{outline:none}
.fila-campo{padding:16px 2px; border-bottom:1px solid var(--linea)}
.fila-etq{display:block; font-size:12px; letter-spacing:.1em; color:var(--txt2); font-weight:700; margin-bottom:10px}
.fila-val{display:flex; align-items:center; gap:12px}
.fila-val > input, .fila-val > select{
  background:none; border:none; padding:0; font-size:17px; font-weight:500; color:var(--txt); flex:1;
}
.fila-val > input:focus, .fila-val > select:focus{outline:none; color:var(--cyan)}
.fila-val > input::placeholder{color:var(--txt3)}
.sel-btn{
  display:flex; align-items:center; gap:12px; flex:1; text-align:left; cursor:pointer;
  background:none; border:none; color:var(--txt); font-family:inherit; font-size:17px;
  font-weight:500; padding:0;
}
.sel-vacio{color:var(--txt3)}
.btn-hora{
  display:flex; align-items:center; gap:7px; background:none; border:none; cursor:pointer;
  color:var(--txt3); font-family:inherit; font-size:15px; padding:0; white-space:nowrap;
}
.btn-hora:hover{color:var(--txt2)}
.hora{display:flex; align-items:center; gap:6px}
.hora input{background:none; border:none; color:var(--txt); font-family:inherit; font-size:15px; width:auto; padding:0}
.interruptor.borde-abajo{border-bottom:1px solid var(--linea); padding:16px 2px}
.con-icono{flex-direction:row !important; align-items:center; gap:12px; font-size:17px}
.pie-guardar{
  padding:12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
  background:linear-gradient(180deg, transparent, var(--g2) 45%);
  max-width:520px; width:100%; margin:0 auto;
}
.btn-guardar{
  width:100%; appearance:none; border:none; cursor:pointer; font-family:inherit;
  background:var(--cyan); color:var(--sobre); font-size:18px; font-weight:700;
  padding:17px; border-radius:16px;
}
.btn-guardar:disabled{opacity:.35; cursor:not-allowed}

/* selectores de cuenta y categor\xEDa */
.velo{z-index:60}
.tabs{display:flex; border-bottom:1px solid var(--linea); margin-bottom:6px}
.tabs button{
  flex:1; appearance:none; background:none; border:none; cursor:pointer; font-family:inherit;
  font-size:15px; font-weight:600; color:var(--txt2); padding:12px 6px;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabs .tab-on{color:var(--cyan); border-bottom-color:var(--cyan)}
.buscar-fila{display:flex; align-items:center; gap:10px; padding:6px 0 12px}
.buscar-fila input{background:none; border:none; font-size:17px; padding:6px 0}
.buscar-fila input:focus{outline:none}
.opcion-sel{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
  background:none; border:none; color:inherit; font-family:inherit; padding:10px 2px;
}
.opcion-sel:hover{background:var(--tinte1)}
.opcion-txt{display:flex; flex-direction:column; gap:2px}
.opcion-txt strong{font-size:17px; font-weight:500}
.opcion-txt em{font-size:13px; color:var(--txt2); font-style:normal}
.nueva-cat{border-top:1px solid var(--linea); margin-top:14px; padding-top:16px}
.colores{display:flex; gap:10px; flex-wrap:wrap; margin:4px 0 16px}
.color{width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0}
.color-on{border-color:var(--txt); transform:scale(1.1)}

/* filtros */
.chips-envueltos{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px}
.chip-quieto{cursor:default}
.rango{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0 4px}
.margen-arriba{margin-top:20px}

/* men\xFA de ajustes */
.fila-menu{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
  background:none; border:none; color:inherit; font-family:inherit; padding:12px 14px;
}
.fila-menu:hover{background:var(--tinte1)}
.fila-menu.sin-flecha{cursor:default}
.fila-menu.sin-flecha:hover{background:none}
.fila-menu-txt{flex:1; display:flex; flex-direction:column; gap:2px; min-width:0}
.fila-menu-txt strong{font-size:16px; font-weight:500}
.fila-menu-txt em{font-size:12.5px; color:var(--txt2); font-style:normal}
.fila-menu.peligro .fila-menu-txt strong{color:var(--coral)}
.palanca{
  width:46px; height:26px; flex-shrink:0; appearance:none; background:var(--tinte4);
  border-radius:14px; position:relative; cursor:pointer; padding:0; border:none;
}
.palanca:checked{background:var(--cyan)}
.palanca::after{
  content:""; position:absolute; top:3px; left:3px; width:20px; height:20px;
  border-radius:50%; background:#fff; transition:transform .15s;
}
.palanca:checked::after{transform:translateX(20px)}
.presu{padding-bottom:10px}
.presu-barra{padding:0 16px 4px}
.hoja-nota.centrado{text-align:center; padding:18px 8px 0}

/* di\xE1logo */
.velo-centro{align-items:center; padding:20px}
.dialogo{
  background:var(--hoja-bg); border:1px solid var(--linea); border-radius:18px;
  padding:22px; width:100%; max-width:360px; animation:entra .16s ease-out;
}
.dialogo h2{font-size:21px; font-weight:700; margin:0 0 14px}
.dialogo p{font-size:15px; margin:0 0 6px; color:var(--txt)}
.dialogo-sub{font-size:14px; color:var(--txt2) !important}
.dialogo-btns{display:flex; gap:10px; justify-content:flex-end; margin-top:20px}
.btn-dialogo{
  appearance:none; background:none; border:1px solid var(--cyan); color:var(--cyan);
  font-family:inherit; font-size:15px; font-weight:600; padding:9px 18px;
  border-radius:11px; cursor:pointer;
}
.btn-dialogo:hover{background:var(--tinte2)}
.btn-dialogo:disabled{opacity:.5; cursor:not-allowed}

/* disponible para gastar */
.tarjeta-disp{width:100%; text-align:left; font-family:inherit; color:inherit; cursor:pointer}
.disp-cab{text-align:center; padding:10px 0 20px}
.cifra-gigante{
  font-size:clamp(34px,10vw,46px); font-weight:700; letter-spacing:-.03em; margin:4px 0 10px;
}
.pastilla-est{
  display:inline-block; margin-top:12px; background:var(--tinte3); color:var(--cyan);
  font-size:14px; font-weight:600; padding:8px 22px; border-radius:20px;
}
.conmutador-ancho{width:100%; margin-bottom:14px}
.conmutador-ancho button{flex:1}
.linea-tot{
  display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;
  padding:14px 16px; background:none; border:none; color:inherit; font-family:inherit;
  font-size:15px; text-align:left;
}
button.linea-tot{cursor:pointer}
button.linea-tot:hover{background:var(--tinte1)}
.linea-tot span{display:flex; align-items:center; gap:11px; min-width:0}
.linea-tot b{font-size:16px; font-weight:700; white-space:nowrap}
.linea-tit{font-weight:700}
.linea-tit span{font-size:17px; font-weight:700}
.linea-hija{padding-left:46px; font-size:14px; color:var(--txt2)}
.linea-hija b{font-size:14px; font-weight:600}
.balance-detalle{border-top:1px solid var(--linea); margin-top:4px; padding-top:4px}
.apagado{opacity:.4}

/* cuentas: encabezados por pesta\xF1a */
.linea-sep{height:1px; background:var(--linea); margin:14px 0}
.par-datos{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px}
.par-datos div{display:flex; flex-direction:column; gap:4px}
.par-datos b{font-size:17px; font-weight:700}
.cupo-total{margin-top:16px}

/* calendario */
.fila-balance{width:100%; background:none; border:none; color:inherit; font-family:inherit; cursor:pointer; text-align:left}
.dia{position:relative}
.dia-reloj{position:absolute; right:-2px; top:-1px; display:flex; opacity:.8}
.seccion-btn{
  display:flex; align-items:center; gap:8px; background:none; border:none; color:inherit;
  font-family:inherit; cursor:pointer; padding:0; width:100%;
}

/* gr\xE1fica de saldo */
.tarjeta-grafica{padding-bottom:12px}
.graf-cab{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px}
.grafica{position:relative; margin:6px -4px 4px}
.grafica svg{display:block; overflow:visible}
.marca-hoy{
  position:absolute; top:2px; transform:translateX(9px);
  font-size:11px; letter-spacing:.12em; font-weight:700; color:var(--txt2);
}

/* detalle de categor\xEDa */
.cat-titulo{display:flex; align-items:center; gap:16px; margin:6px 0 18px}
.cat-titulo strong{display:block; font-size:26px; font-weight:700; letter-spacing:-.02em}
.cat-titulo em{display:block; font-size:14px; color:var(--txt2); font-style:normal; margin-top:2px}
.gris{color:var(--txt2)}
.limite-edit{display:flex; align-items:center; gap:8px}
.limite-edit input{
  width:130px; text-align:right; background:var(--hueco); border:1px solid var(--cyan);
  color:var(--txt); font-family:inherit; font-size:15px; font-weight:700; padding:6px 9px; border-radius:9px;
}
.btn-texto{display:inline-flex; align-items:center; gap:6px}

/* pago ya realizado */
.insignia-ok{background:#2A3D2E; color:var(--verde); border-color:#2E6B51}
.app.claro .insignia-ok{background:#D9F0E5; color:#166B4F; border-color:#A9DCC6}
.btn-deshacer{
  width:100%; appearance:none; cursor:pointer; font-family:inherit;
  background:var(--tinte1); border:1px solid var(--cyan); color:var(--cyan);
  font-size:17px; font-weight:600; padding:16px; border-radius:16px;
}
.btn-deshacer:hover{background:var(--tinte3)}

/* gu\xEDa y modo simple */
.tarjeta-guia{border-color:#2A4A5E}
.guia-cab{display:flex; align-items:center; gap:12px}
.guia-cab strong{display:block; font-size:15.5px; font-weight:600}
.guia-cab em{display:block; font-size:12.5px; color:var(--txt2); font-style:normal; margin-top:2px; line-height:1.4}
.tarjeta-guia .fila-btns{margin-top:12px}
.btn-chico{
  appearance:none; border:none; cursor:pointer; font-family:inherit;
  background:var(--cyan); color:var(--sobre); font-size:14px; font-weight:700;
  padding:8px 20px; border-radius:11px;
}
.disp-nota{font-size:12.5px; color:var(--txt2); margin:10px 0 0; line-height:1.4; max-width:210px}
.guia-intro{font-size:16px; line-height:1.6; color:var(--txt2); margin:0 0 24px}
.guia-intro strong{color:var(--txt); font-weight:600}
.paso{display:flex; gap:14px; align-items:flex-start}
.paso-num{display:flex; flex-direction:column; align-items:center; align-self:stretch}
.paso-linea{flex:1; width:2px; background:var(--linea); margin:6px 0; min-height:14px}
.paso-txt{padding-bottom:22px; flex:1}
.paso-txt strong{display:block; font-size:16.5px; font-weight:600; margin-bottom:5px; line-height:1.35}
.paso-txt em{display:block; font-size:14px; color:var(--txt2); font-style:normal; line-height:1.55}
.guia-cierre{margin-top:8px}
.guia-cierre h3{font-size:16px; font-weight:700; margin:0 0 10px}
.guia-cierre p{font-size:14px; color:var(--txt2); line-height:1.6; margin:0 0 8px}
.guia-cierre p:last-child{margin-bottom:0}
.guia-cierre strong{color:var(--txt)}
.enlace-abajo{margin-top:14px; border-radius:16px; padding:14px}

/* d\xEDa del calendario tocable */
button.celda{
  background:none; border:none; cursor:pointer; font-family:inherit; color:inherit;
  border-radius:10px;
}
button.celda:hover{background:var(--tinte1)}
.dia-resumen{
  display:flex; gap:20px; padding:4px 2px 16px; border-bottom:1px solid var(--linea); margin-bottom:6px;
}
.dia-resumen span{display:flex; flex-direction:column; gap:4px}
.dia-resumen b{font-size:19px; font-weight:700}
.pendiente-marca{
  display:inline-flex; align-items:center; gap:5px; color:var(--ambar);
  font-size:11.5px; font-weight:700; letter-spacing:.04em;
}


/* \u2500\u2500 lista agrupada por fecha, al estilo de una lista de sistema \u2500\u2500 */
.lista-fechas{display:flex; flex-direction:column; gap:20px}
.grupo-fecha{display:flex; flex-direction:column; gap:7px}
.fecha-cab{
  display:flex; align-items:center; gap:9px; margin:0 0 0 4px;
  font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--txt3);
}
.fecha-hoy-cab{color:var(--cyan)}
.fecha-vencida{color:var(--coral)}
.etiqueta-venc{
  font-size:10px; letter-spacing:.06em; background:var(--coral); color:var(--sobre);
  padding:2px 7px; border-radius:6px; font-weight:700;
}
.lista-agrupada{background:var(--sup); border-radius:16px; overflow:hidden; box-shadow:var(--sombra)}
.fila-envoltura{position:relative; overflow:hidden}
.fila-envoltura + .fila-envoltura .fila-tx::before{
  content:""; position:absolute; left:64px; right:0; top:0; height:1px; background:var(--linea);
}
.fila-tx{
  position:relative; display:flex; align-items:center; gap:13px; width:100%;
  padding:13px 15px; background:var(--sup); border:none; color:inherit;
  font-family:inherit; text-align:left; cursor:pointer; touch-action:pan-y;
}
.fila-suelta{transition:transform .2s cubic-bezier(.2,.8,.3,1)}
.fila-tx:active{background:var(--tinte1)}
.fila-ico{flex-shrink:0}
.fila-nom{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.fila-nom strong{font-size:16px; font-weight:550; letter-spacing:-.01em}
.fila-nom em{font-size:12.5px; color:var(--txt2); font-style:normal}
.fila-cifras{display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0}
.fila-cifras b{font-size:16px; font-weight:650; font-variant-numeric:tabular-nums}
.fila-cifras em{font-size:11.5px; color:var(--txt3); font-style:normal; font-variant-numeric:tabular-nums}

/* deslizar para pagar */
.fondo-pagar{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end;
  gap:9px; padding-right:20px; background:var(--tinte2); color:var(--txt2);
  font-size:14px; font-weight:600;
}
.fondo-listo{background:var(--cyan); color:var(--sobre)}

/* estado de cierre */
.al-dia{display:flex; flex-direction:column; align-items:center; gap:8px; padding:32px 20px; text-align:center}
.al-dia-marca{
  display:grid; place-items:center; width:56px; height:56px; border-radius:50%;
  background:var(--tinte2); color:var(--cyan); margin-bottom:4px;
}
.al-dia strong{font-size:19px; font-weight:650}
.al-dia em{font-size:14px; color:var(--txt2); font-style:normal}

/* el anillo acompa\xF1a el conteo */
.anillo circle{transition:stroke-dasharray .6s cubic-bezier(.3,.9,.3,1)}
@media (prefers-reduced-motion:reduce){ .anillo circle{transition:none} }

/* captura escrita */
.captura{padding:4px 0 6px}
.captura-fila{display:flex; align-items:flex-end; gap:10px}
.captura-fila .campo-captura{flex:1}
.micro{
  flex-shrink:0; width:44px; height:44px; border-radius:50%; cursor:pointer;
  background:var(--tinte2); border:1px solid var(--linea); color:var(--txt2);
  display:grid; place-items:center;
}
.micro-on{background:var(--coral); border-color:transparent; color:var(--sobre); animation:latido 1.4s ease-in-out infinite}
@keyframes latido{0%,100%{opacity:1} 50%{opacity:.55}}
.escuchando{font-size:12.5px; color:var(--coral); margin:10px 0 0}
.tarjeta-captura{padding:12px 16px 14px}
.tarjeta-captura .campo-captura{font-size:17px; border-bottom-width:1px; border-bottom-color:var(--linea)}
.tarjeta-captura .campo-captura:focus{border-bottom-color:var(--cyan)}
.campo-captura{
  background:none; border:none; border-bottom:2px solid var(--cyan);
  font-size:20px; font-weight:500; padding:10px 2px; border-radius:0; color:var(--txt);
}
.campo-captura::placeholder{color:var(--txt3); font-weight:400}
.campo-captura:focus{outline:none}
.ejemplos{display:flex; gap:7px; flex-wrap:wrap; margin-top:14px}
.ejemplos .chip{font-size:12.5px; font-weight:400}
.lectura{
  margin-top:18px; padding-top:16px; border-top:1px solid var(--linea);
  animation:entra .18s ease-out;
}
.ceja-lectura{
  font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--txt3); font-weight:700; margin:0 0 10px;
}
.fichas{display:flex; gap:7px; flex-wrap:wrap}
.ficha{
  position:relative; display:inline-flex; align-items:center; gap:6px;
  background:var(--tinte2); border:1px solid var(--linea); color:var(--txt);
  font-family:inherit; font-size:13.5px; font-weight:600;
  padding:7px 13px; border-radius:20px; cursor:pointer;
}
.ficha-falta{border-style:dashed; color:var(--txt3); font-weight:500}
.ficha-dir{border:none}
.ficha-dir.entra{background:var(--cyan); color:var(--sobre)}
.ficha-dir.sale{background:var(--coral); color:var(--sobre)}
.ficha-inv{border-color:var(--cyan); color:var(--cyan)}
.ficha-ia{background:var(--cyan); color:var(--sobre); border:none; font-size:11px; letter-spacing:.08em}
.dudas{display:flex; flex-direction:column; gap:6px; margin-top:10px}
.duda{
  display:flex; align-items:center; gap:8px; text-align:left; cursor:pointer;
  background:var(--tinte1); border:1px dashed var(--ambar); color:var(--txt2);
  font-family:inherit; font-size:13px; padding:9px 12px; border-radius:12px;
}
.duda:hover{background:var(--tinte2)}
.duda-quieta{cursor:default}
.btn-ia{
  width:100%; display:flex; align-items:center; justify-content:center; gap:9px;
  background:none; border:1px solid var(--cyan); color:var(--cyan); cursor:pointer;
  font-family:inherit; font-size:15px; font-weight:600; padding:12px; border-radius:14px; margin-top:14px;
}
.btn-ia:disabled{opacity:.5}
.fecha-oculta{position:absolute; inset:0; opacity:0; cursor:pointer; padding:0}
.lectura-item{
  padding:12px 0; border-bottom:1px solid var(--linea);
}
.lectura-item:last-of-type{border-bottom:none}
.lectura-cab{display:flex; align-items:center; gap:10px; margin-bottom:9px}
.lectura-nombre{flex:1; font-size:16.5px; font-weight:600; min-width:0}
.lectura-cab b{font-size:16.5px; font-weight:700}
.campo-captura{resize:none; line-height:1.4; font-family:inherit}

/* pr\xE9stamos */
.monto-editable{
  background:none; border:none; border-bottom:1px solid var(--linea); color:var(--txt);
  font-family:inherit; font-size:29px; font-weight:700; letter-spacing:-.02em;
  padding:2px 0 8px; border-radius:0;
}
.monto-editable:focus{outline:none; border-bottom-color:var(--cyan)}
.fila-tasa{display:flex; align-items:center; gap:10px; margin-top:14px}
.fila-tasa input{
  width:120px; background:var(--hueco); border:1px solid var(--linea); color:var(--txt);
  font-family:inherit; font-size:22px; font-weight:700; padding:9px 12px; border-radius:12px; text-align:right;
}
.fila-tasa input:focus{outline:none; border-color:var(--cyan)}
.fila-tasa span{font-size:15px; color:var(--txt2)}
.equivalencia{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:14px;
  padding-top:12px; border-top:1px solid var(--linea); font-size:13.5px; color:var(--txt2);
}
.equivalencia b{color:var(--txt); font-size:15px; font-weight:700}
.mini-input.ancho{width:150px}
.fila-ajuste select.mini-input{text-align:left}
.sugerencia{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left; cursor:pointer;
  background:var(--tinte1); border:1px dashed var(--cyan); color:var(--txt2);
  font-family:inherit; font-size:13.5px; line-height:1.5; padding:13px 15px;
  border-radius:14px; margin-bottom:12px;
}
.sugerencia b{color:var(--txt)}
.aviso-grave{background:var(--tinte2); border-left:3px solid var(--coral); color:var(--txt)}
.tarjeta-dup{border-left:3px solid var(--ambar)}
.tarjeta-dup .fila-btns-izq{margin-top:14px}
.nom-enlace{
  display:flex; flex-direction:column; gap:2px; align-items:flex-start; text-align:left;
  background:none; border:none; padding:0; cursor:pointer; color:inherit; font-family:inherit; width:100%;
}
.nom-enlace strong{font-size:16px; font-weight:600}
.nom-enlace em{font-size:12px; color:var(--txt2); font-style:normal}
.nota-linea{
  background:none; border:none; border-bottom:1px dashed var(--linea); color:var(--txt2);
  font-family:inherit; font-size:13px; padding:6px 0 5px; border-radius:0; margin-top:8px;
}
.nota-linea:focus{outline:none; border-bottom-color:var(--cyan); color:var(--txt)}
.nota-linea::placeholder{color:var(--txt3)}
.entrega{padding:12px 16px 14px}
.entrega-cab{display:flex; align-items:center; gap:10px}
.entrega-fecha{flex:1; font-size:14.5px; font-weight:550}
.entrega-cab b{font-size:15.5px; font-weight:700}
.punto-mov{width:8px; height:8px; border-radius:50%; flex-shrink:0}
.punto-mov.entra{background:var(--cyan)}
.punto-mov.sale{background:var(--coral)}
.btn-principal.ancho-auto{width:auto; padding:12px 22px; margin-top:0}

@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
